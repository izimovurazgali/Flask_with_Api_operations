<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ homework.title }}</title>


<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        padding: 40px;
    }

    .homework {
        max-width: 800px;
        margin: auto;
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .header {
        width: 100%;
        height: 250px;
        object-fit: cover;
    }

    .content {
        padding: 30px;
    }

    .title {
        font-size: 30px;
        margin-bottom: 15px;
    }

    .group {
        display: inline-block;
        background: #e3f2fd;
        color: #1565c0;
        padding: 8px 15px;
        border-radius: 20px;
        margin-bottom: 25px;
    }

    .body {
        font-size: 18px;
        line-height: 1.6;
        color: #444;
    }

</style>


</head>

<body>


<div class="homework">

    <img
        class="header"
        src="{{ homework.header_url }}"
        alt="Шапка домашней работы"
    >

    <div class="content">

        <h1 class="title">
            {{ homework.title }}
        </h1>

        <div class="group">
            {{ homework.pinned_group }}
        </div>

        <p class="body">
            {{ homework.body }}
        </p>

    </div>

</div>

<form action="/homework" method="post">
    <label for="homework_text">Enter text:</label>
        <input type="text" id="homework_text" name="homework_text" required>
        <button type="submit">Submit</button>
</form>
</body>
</html>
